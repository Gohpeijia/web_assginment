<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sunbake Product Reviews</title>

    <link rel="stylesheet" href="../CSS/menu.css">
    <link rel="stylesheet" href="../CSS/theme.css">
    <link rel="stylesheet" href="../CSS/review.css">
</head>

<body>

    <header>
        <nav class="navigation_bar">
            <!-- Left Navigation -->
            <div class="nav-left">
                <a href="../HTML/menu.html"
                class="nav_fonts hover-underline">

                    Our Products

                </a>

                <a href="../HTML/about_us.html"
                class="nav_fonts hover-underline">

                    About Us

                </a>
            </div>
            <!-- Centre Logo -->

            <div class="nav-center">

                <a href="../HTML/index.html" class="logo">

                    <img src="../Assets/Images/logo.png"
                        alt="SUNBAKE">

                </a>

            </div>

            <!-- Right Icons -->

            <div class="nav-right">

                <a href="#" id="account">

                    <img src="../Assets/Images/account.png"
                        class="icons"
                        alt="Account">

                </a>

                <a href="#">

                    <img src="../Assets/Images/cartIcon.png"
                        class="icons"
                        alt="Cart">

                </a>

            </div>

        </nav>

    </header>

    <main class="review-page-container">

        <section class="review-product-layout">

            <div class="review-product-image">

                <img
                    id="productImage"
                    src=""
                    alt="Selected cake">

            </div>

            <div class="review-product-information">

                <label for="productSelector">
                    Product
                </label>

                <select id="productSelector">
                </select>

                <h1 id="productName">
                    Product Name
                </h1>

                <div class="product-information-block">

                    <h2>Allergens</h2>

                    <ul id="allergensList">
                    </ul>

                </div>

                <div class="product-rating-summary">

                    <h2>Average Rating</h2>

                    <p
                        id="averageStars"
                        class="average-review-stars">
                        ☆☆☆☆☆
                    </p>

                    <p id="averageRating">
                        0.0 / 5
                    </p>

                    <p id="reviewCount">
                        0 reviews
                    </p>

                </div>

            </div>

        </section>

        <section class="comment-section">

            <div class="comment-heading">

                <h2>Customer Comments</h2>

                <select
                    id="ratingFilter"
                    aria-label="Filter reviews by rating">

                    <option value="all">
                        All Ratings
                    </option>

                    <option value="5">
                        5 Stars
                    </option>

                    <option value="4">
                        4 Stars
                    </option>

                    <option value="3">
                        3 Stars
                    </option>

                    <option value="2">
                        2 Stars
                    </option>

                    <option value="1">
                        1 Star
                    </option>

                </select>

            </div>

            <div id="reviewList">
            </div>

            <p id="noReviews">
                No reviews for this product yet.
            </p>

        </section>

        <section class="write-review-section">

            <h2>Write a Review</h2>

            <form id="reviewForm">

                <div class="review-form-group">

                    <label for="reviewerName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="reviewerName"
                        maxlength="40"
                        placeholder="Enter your name"
                        required>

                </div>

                <div class="review-form-group">

                    <label for="reviewRating">
                        Rating
                    </label>

                    <select
                        id="reviewRating"
                        required>

                        <option value="">
                            Select Rating
                        </option>

                        <option value="5">
                            ★★★★★ — Excellent
                        </option>

                        <option value="4">
                            ★★★★ — Very Good
                        </option>

                        <option value="3">
                            ★★★ — Good
                        </option>

                        <option value="2">
                            ★★ — Fair
                        </option>

                        <option value="1">
                            ★ — Poor
                        </option>

                    </select>

                </div>

                <div class="review-form-group">

                    <label for="reviewComment">
                        Comment
                    </label>

                    <textarea
                        id="reviewComment"
                        rows="5"
                        maxlength="300"
                        placeholder="Write your comment..."
                        required></textarea>

                    <p id="characterCount">
                        0 / 300 characters
                    </p>

                </div>

                <p
                    id="reviewMessage"
                    aria-live="polite">
                </p>

                <button
                    type="submit"
                    class="add-to-cart-btn">

                    Submit Review
                </button>

            </form>

        </section>

    </main>

    <footer>

        <p class="copyright">
            &copy; 2026 SUNBAKE Bakers.
            SUNBAKE Manufactory Sdn Bhd.
        </p>

    </footer>

    <script src="../JS/website.js"></script>

    <script src="../JS/product.js"></script>

    <script src="../JS/review.js"></script>

</body>
</html>
