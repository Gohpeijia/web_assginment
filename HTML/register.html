<!DOCTYPE html>
<html lang="en">

<head>
    <title>Register your Sunbake Account</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../CSS/theme.css">
    <link rel="stylesheet" href="../CSS/register_page.css">
    <script src="../JS/validation.js" defer></script>
</head>

<body>

<header>
    <div class="login_title">
        <a href="../HTML/index.html">
            <img src="../Assets/Images/logo.png" alt="logo">
        </a>
    </div>
</header>

<form class="registerr" id="registerr_form">

    <!--STEP 1 - USERNAME-->
    <div id="step1">

        <h2>Create Account</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
            required>

        <button
            type="button"
            id="nextBtn1">
            Next
        </button>

    </div>


    <!-- STEP 2 - EMAIL-->
    <div
        id="step2"
        style="display:none;">

        <h2>Create Account</h2>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required>

        <div class="button_group">

            <button
                type="button"
                id="backBtn1">
                Back
            </button>

            <button
                type="button"
                id="nextBtn2">
                Next
            </button>

        </div>

    </div>


    <!--STEP 3 - PASSWORD-->
    <div
        id="step3">

        <h2>Create Account</h2>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <input
            type="password"
            id="confirm_password"
            placeholder="Confirm Password"
            required>

        <div class="button_group">

            <button
                type="button"
                id="backBtn2">
                Back
            </button>

            <button
                type="submit">
                Create Account
            </button>

        </div>

    </div>

</form>


<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-box">
        <div id="overlaySpinner" class="spinner"></div>
        <p id="overlayMessage"></p>

        <button
            type="button"
            id="overlayClose"
            class="overlay-close hidden">
            OK
        </button>
    </div>
</div>

</body>
</html>
