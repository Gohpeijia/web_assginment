<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login to Sunbake</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/theme.css">
    <link rel="stylesheet" href="../CSS/login_page.css">
    <link rel="stylesheet" href="../CSS/darkmode.css">
</head>

<body>
<header>
    <div class="login_title">
    <a href="../HTML/index.html"><img src="../Assets/Images/logo.png" alt="Sunbake Logo"></a>
    </div>
</header>


<div class="login_content">
    <h1>Welcome to Sunbake</h1>
    <h3>Log in to your account</h3>
    <br>

    <form class="loginn" id="loginForm">
        <input type="text" id="loginInput" placeholder="Username or Email" required>
        <div class="password_holder">
        <input required type="password" id="password" placeholder="Password" required>
        <span class="eye">👁</span>
        </div>

        <p class="forgotpw">
            <a href="">Forgot your Password?</a>
        </p>

        <button type="submit">Login</button>

        <p class="newuser">
            <a href="register.html">New to Sunbake? Create an Account!</a>
        </p>
    </form>

    <br><br>


</div>

<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-box">
        <div id="overlaySpinner" class="spinner"></div>
        <p id="overlayMessage">Logging you in...</p>
        <button type="button" id="overlayClose" class="overlay-close hidden">OK</button>
    </div>
</div>
    <script src="../JS/login.js"></script>
    <script src="../JS/website.js"></script>
</body>
</html>
